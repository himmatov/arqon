<script>

   MENGA CONSULTING — "Sardorning Koreya sarguzashti"

const CONTACT = ''; // masalan: '📞 +998 90 123 45 67   •   Instagram: @menga_consulting'

const W = 1080, H = 1920, DURATION = 60;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const FONT = '"Inter","Noto Color Emoji","WenQuanYi Zen Hei",sans-serif';
const C = { blue:'#1E4FD8', red:'#E63946', gold:'#FFC93C', navy:'#0B1F4D', ink:'#14142B', green:'#22C55E' };
const OUT = '#14142B';

/* ---------- helpers ---------- */
const clamp = (v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const lerp = (a,b,t)=>a+(b-a)*t;
const prog = (t,a,b)=>clamp((t-a)/(b-a));
const easeOut = t=>1-Math.pow(1-t,3);
const easeInOut = t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const backOut = t=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const pop = t=>backOut(clamp(t));
const rnd = i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const font = (size,weight=800)=>`${weight} ${size}px ${FONT}`;
const seg = new Intl.Segmenter('uz',{granularity:'grapheme'});
const graphemes = s=>Array.from(seg.segment(s),x=>x.segment);
const TYPE_SPEED = 38; // belgi / soniya

function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);}
function wrap(text,maxW){
  const out=[];
  for(const para of text.split('\n')){
    let line='';
    for(const w of para.split(' ')){
      const test=line?line+' '+w:w;
      if(ctx.measureText(test).width>maxW && line){out.push(line);line=w;} else line=test;
    }
    out.push(line);
  }
  return out;
}
function isTalking(age,text){return age>=0 && age < graphemes(text).length/TYPE_SPEED;}
function emoji(ch,x,y,size,rot=0,alpha=1){
  ctx.save();ctx.globalAlpha*=alpha;ctx.translate(x,y);ctx.rotate(rot);
  ctx.font=`${size}px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(ch,0,0);ctx.restore();
}
function bigText(text,x,y,size,fill,stroke,age,{rot=0,weight=900,maxW=1000}={}){
  if(age<0)return;
  const p=pop(age/0.4);
  ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.scale(p,p);
  ctx.font=font(size,weight);ctx.textAlign='center';ctx.textBaseline='middle';
  const lines=wrap(text,maxW);const lh=size*1.15;
  lines.forEach((l,i)=>{
    const ly=(i-(lines.length-1)/2)*lh;
    if(stroke){ctx.lineJoin='round';ctx.lineWidth=size*0.2;ctx.strokeStyle=stroke;ctx.strokeText(l,0,ly);}
    ctx.fillStyle=fill;ctx.fillText(l,0,ly);
  });
  ctx.restore();
}
function caption(text,age,{y=110,size=60,bg=C.navy,fg='#fff',rot=-0.015}={}){
  if(age<0)return;
  const p=pop(age/0.4);
  ctx.save();ctx.font=font(size,900);
  const lines=wrap(text,880);const lh=size*1.2;const h=lines.length*lh+48;
  const w=Math.min(1010,Math.max(...lines.map(l=>ctx.measureText(l).width))+90);
  ctx.translate(540,y+h/2);ctx.rotate(rot);ctx.scale(p,p);
  ctx.fillStyle='rgba(0,0,0,.28)';rr(-w/2+10,-h/2+14,w,h,34);ctx.fill();
  ctx.fillStyle=bg;rr(-w/2,-h/2,w,h,34);ctx.fill();
  ctx.lineWidth=7;ctx.strokeStyle='#fff';ctx.stroke();
  ctx.fillStyle=fg;ctx.textAlign='center';ctx.textBaseline='middle';
  lines.forEach((l,i)=>ctx.fillText(l,0,-h/2+24+lh*(i+.5)));
  ctx.restore();
}
function bubble(x,y,w,text,age,{tx,ty,size=50,bg='#fff',fg=C.ink,think=false}={}){
  if(age<0)return;
  ctx.save();ctx.font=font(size,800);
  const lines=wrap(text,w-80);const lh=size*1.25;const h=lines.length*lh+60;
  const bw=Math.min(w,Math.max(...lines.map(l=>ctx.measureText(l).width))+90);
  const p=pop(age/0.35);
  ctx.translate(x,y);ctx.scale(p,p);
  const lx=tx-x, ly=ty-y;
  ctx.lineJoin='round';
  const shape=()=>{
    ctx.beginPath();ctx.roundRect(-bw/2,-h/2,bw,h,think?h/2.2:42);
    if(!think){
      const side=ly>0?h/2-4:-h/2+4;const bx=clamp(lx*0.45,-bw/2+70,bw/2-70);
      ctx.moveTo(bx-38,side);ctx.lineTo(lx*0.55+bx*0.45,side+(ly>0?1:-1)*Math.min(Math.abs(ly)-h/2,150));ctx.lineTo(bx+38,side);
    }
  };
  ctx.save();ctx.translate(9,13);ctx.fillStyle='rgba(0,0,0,.22)';shape();ctx.fill();ctx.restore();
  ctx.lineWidth=10;ctx.strokeStyle=OUT;shape();ctx.stroke();ctx.fillStyle=bg;shape();ctx.fill();
  if(think){
    for(const [f,r] of [[0.45,24],[0.75,14]]){
      const cx=lerp(0,lx,f), cy=lerp(h/2,ly,f);
      ctx.beginPath();ctx.arc(cx,cy,r,0,7);ctx.fillStyle=bg;ctx.fill();ctx.lineWidth=7;ctx.stroke();
    }
  }
  // typewriter
  let n=Math.floor(age*TYPE_SPEED);
  ctx.fillStyle=fg;ctx.textAlign='center';ctx.textBaseline='middle';
  lines.forEach((l,i)=>{
    if(n<=0)return;const g=graphemes(l);
    const part=g.slice(0,n).join('');n-=g.length+1;
    const full=ctx.measureText(l).width;
    ctx.textAlign='left';ctx.fillText(part,-full/2,-h/2+30+lh*(i+.5));
  });
  ctx.restore();
}

/* ---------- characters ---------- */
function atlas(x0,y0,x1,y1,t){
  const cols=['#E91E63','#FFC107','#00ACC1','#7B1FA2','#FF5722','#43A047'];
  for(let i=0;i<14;i++){
    ctx.beginPath();const bx=x0+i*34-40;
    ctx.moveTo(bx,y0);
    for(let y=y0;y<=y1;y+=20)ctx.lineTo(bx+Math.sin(y/28+i)*12,y);
    for(let y=y1;y>=y0;y-=20)ctx.lineTo(bx+34+Math.sin(y/28+i+1)*12,y);
    ctx.closePath();ctx.fillStyle=cols[i%cols.length];ctx.fill();
  }
}
function heart(x,y,s,col='#FF2E63'){
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.beginPath();
  ctx.moveTo(0,8);ctx.bezierCurveTo(-26,-12,-12,-30,0,-16);ctx.bezierCurveTo(12,-30,26,-12,0,8);
  ctx.fillStyle=col;ctx.fill();ctx.restore();
}
function person(x,y,s,o={}){
  o=Object.assign({skin:'#F3C79B',shirt:'#2F6BFF',pants:'#24324A',hair:'#1b1b1b',style:'short',
    eyes:'open',mouth:'smile',armL:.2,armR:.2,look:0,dress:false,scarf:'#8E24AA',
    itemL:null,itemR:null,itemSize:110,sweat:false,tears:false,brow:0,mustache:false,glasses:false,
    cape:null,badge:null,tie:null,backpack:false,t:0,rot:0,blush:true},o);
  const t=o.t;
  ctx.save();ctx.translate(x,y);ctx.rotate(o.rot);ctx.scale(s,s);
  ctx.lineJoin='round';ctx.lineCap='round';ctx.strokeStyle=OUT;ctx.lineWidth=7;
  const main=o.dress?o.scarf:o.shirt;
  // cape
  if(o.cape){
    const wv=Math.sin(t*9)*28;ctx.fillStyle=o.cape;ctx.beginPath();
    ctx.moveTo(-85,-350);ctx.quadraticCurveTo(-180+wv,-170,-165+wv,-20);
    ctx.quadraticCurveTo(0,10+wv*.5,165-wv,-20);ctx.quadraticCurveTo(180-wv,-170,85,-350);
    ctx.closePath();ctx.fill();ctx.stroke();
  }
  if(o.backpack){ctx.fillStyle='#F59E0B';rr(-125,-350,250,210,46);ctx.fill();ctx.stroke();}
  // legs
  if(!o.dress){
    ctx.fillStyle=o.pants;
    rr(-68,-170,58,160,22);ctx.fill();ctx.stroke();
    rr(10,-170,58,160,22);ctx.fill();ctx.stroke();
  }
  ctx.fillStyle='#2a2a35';
  ctx.beginPath();ctx.ellipse(-44,-14,50,24,0,0,7);ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.ellipse(44,-14,50,24,0,0,7);ctx.fill();ctx.stroke();
  // body
  if(o.dress){
    const dressPath=()=>{ctx.beginPath();
    ctx.moveTo(-88,-365);ctx.quadraticCurveTo(-100,-370,-110,-300);ctx.lineTo(-140,-28);
    ctx.quadraticCurveTo(0,-8,140,-28);ctx.lineTo(110,-300);ctx.quadraticCurveTo(100,-370,88,-365);ctx.closePath();};
    dressPath();ctx.fillStyle='#E91E63';ctx.fill();ctx.save();ctx.clip();atlas(-150,-380,150,-10,t);ctx.restore();
    dressPath();ctx.stroke();
  } else {
    ctx.fillStyle=o.shirt;rr(-96,-370,192,232,56);ctx.fill();ctx.stroke();
    if(o.tie){
      ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(-40,-368);ctx.lineTo(0,-300);ctx.lineTo(40,-368);ctx.closePath();ctx.fill();
      ctx.fillStyle=o.tie;ctx.beginPath();ctx.moveTo(-14,-352);ctx.lineTo(14,-352);ctx.lineTo(20,-250);ctx.lineTo(0,-226);ctx.lineTo(-20,-250);ctx.closePath();ctx.fill();ctx.lineWidth=4;ctx.stroke();ctx.lineWidth=7;
    }
    if(o.badge){
      ctx.beginPath();ctx.arc(-50,-290,30,0,7);ctx.fillStyle=C.gold;ctx.fill();ctx.stroke();
      ctx.fillStyle=C.navy;ctx.font=font(36,900);ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(o.badge,-50,-288);
    }
    if(o.backpack){ctx.strokeStyle='#B45309';ctx.lineWidth=16;ctx.beginPath();ctx.moveTo(-62,-362);ctx.lineTo(-58,-170);ctx.moveTo(62,-362);ctx.lineTo(58,-170);ctx.stroke();ctx.strokeStyle=OUT;ctx.lineWidth=7;}
  }
  // arms
  const arm=(side,a,item)=>{
    const sx=side*80,sy=-332;const L=150;
    const hx=sx+side*Math.sin(a)*L, hy=sy+Math.cos(a)*L;
    ctx.lineWidth=60;ctx.strokeStyle=OUT;ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(hx,hy);ctx.stroke();
    ctx.lineWidth=46;ctx.strokeStyle=main;ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(hx,hy);ctx.stroke();
    ctx.lineWidth=7;ctx.strokeStyle=OUT;
    ctx.beginPath();ctx.arc(hx,hy,28,0,7);ctx.fillStyle=o.skin;ctx.fill();ctx.stroke();
    if(item)emoji(item,hx+side*10,hy-40,o.itemSize,side*0.15);
  };
  arm(-1,o.armL,o.itemL);arm(1,o.armR,o.itemR);
  // head
  ctx.save();ctx.translate(o.look*6,0);
  const hy=-482;
  if(o.style==='scarf'){
    ctx.fillStyle=o.scarf;ctx.beginPath();ctx.ellipse(0,hy+8,148,152,0,0,7);ctx.fill();ctx.stroke();
    ctx.beginPath();ctx.moveTo(-138,hy+50);ctx.lineTo(-110,-340);ctx.lineTo(110,-340);ctx.lineTo(138,hy+50);ctx.closePath();ctx.fill();ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.75)';
    for(let i=0;i<9;i++){const a=Math.PI*(1.05+i*0.11);ctx.beginPath();ctx.arc(Math.cos(a)*120,hy+8+Math.sin(a)*124,9,0,7);ctx.fill();}
    ctx.fillStyle=o.skin;ctx.beginPath();ctx.ellipse(0,hy+14,100,108,0,0,7);ctx.fill();ctx.stroke();
  } else {
    ctx.fillStyle=o.skin;
    for(const sd of[-1,1]){ctx.beginPath();ctx.arc(sd*113,hy+10,25,0,7);ctx.fill();ctx.stroke();}
    ctx.beginPath();ctx.arc(0,hy,116,0,7);ctx.fill();ctx.stroke();
    ctx.fillStyle=o.hair;
    if(o.style==='bun'){ctx.beginPath();ctx.arc(0,hy-128,46,0,7);ctx.fill();ctx.stroke();}
    ctx.beginPath();ctx.arc(0,hy,120,Math.PI*1.0,Math.PI*2.0);
    if(o.style==='neat'){ctx.lineTo(118,hy-20);ctx.quadraticCurveTo(40,hy-40,-30,hy-90);ctx.quadraticCurveTo(-80,hy-30,-118,hy-10);}
    else if(o.style==='bun'){ctx.lineTo(116,hy+60);ctx.lineTo(96,hy-30);ctx.quadraticCurveTo(0,hy-70,-96,hy-30);ctx.lineTo(-116,hy+60);}
    else{ctx.lineTo(92,hy-38);ctx.lineTo(62,hy-18);ctx.lineTo(32,hy-46);ctx.lineTo(0,hy-22);ctx.lineTo(-32,hy-48);ctx.lineTo(-62,hy-20);ctx.lineTo(-92,hy-42);}
    ctx.closePath();ctx.fill();ctx.stroke();
    if(o.style==='doppi'){
      ctx.fillStyle='#151515';ctx.beginPath();
      ctx.moveTo(-104,hy-62);ctx.lineTo(-86,hy-138);ctx.quadraticCurveTo(0,hy-160,86,hy-138);ctx.lineTo(104,hy-62);
      ctx.quadraticCurveTo(0,hy-78,-104,hy-62);ctx.closePath();ctx.fill();ctx.stroke();
      ctx.fillStyle='#fff';
      for(const px of[-55,0,55]){ctx.save();ctx.translate(px,hy-108);ctx.rotate(px/120);
        ctx.beginPath();ctx.moveTo(0,-22);ctx.quadraticCurveTo(18,0,0,22);ctx.quadraticCurveTo(-14,4,0,-22);ctx.fill();ctx.restore();}
      ctx.strokeStyle='#fff';ctx.lineWidth=5;ctx.beginPath();
      for(let i=0;i<=12;i++){const xx=-96+i*16;ctx.lineTo(xx,hy-74+(i%2?-8:0)-Math.sin(i/12*Math.PI)*8);}ctx.stroke();
      ctx.strokeStyle=OUT;ctx.lineWidth=7;
    }
  }
  // face
  const ex=42,ey=hy+4;
  ctx.lineWidth=7;
  for(const sd of[-1,1]){
    const X=sd*ex;
    if(o.eyes==='heart'){heart(X,ey,1.6+Math.sin(t*10)*0.25);}
    else if(o.eyes==='happy'){ctx.beginPath();ctx.arc(X,ey+10,20,Math.PI*1.1,Math.PI*1.9);ctx.stroke();}
    else if(o.eyes==='closed'){ctx.beginPath();ctx.arc(X,ey-4,18,Math.PI*0.15,Math.PI*0.85);ctx.stroke();}
    else if(o.eyes==='spiral'){
      ctx.save();ctx.translate(X,ey);ctx.rotate(t*8*sd);ctx.beginPath();
      for(let a=0;a<Math.PI*5;a+=0.2){const r=a*2;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);}ctx.lineWidth=5;ctx.stroke();ctx.restore();
    } else {
      const wide=o.eyes==='wide';
      ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(X,ey,wide?30:24,wide?36:30,0,0,7);ctx.fill();ctx.lineWidth=5;ctx.stroke();
      ctx.fillStyle=OUT;const py=o.eyes==='sad'?8:0;
      ctx.beginPath();ctx.arc(X+o.look*8,ey+4+py,wide?9:13,0,7);ctx.fill();
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(X+o.look*8+4,ey-1+py,4,0,7);ctx.fill();
    }
    // brows
    let br=o.brow;if(o.eyes==='sad')br=-0.5;
    ctx.lineWidth=8;ctx.beginPath();
    const by=ey-(o.eyes==='wide'?52:44);
    ctx.moveTo(X-22,by+sd*br*14);ctx.lineTo(X+22,by-sd*br*14);ctx.stroke();
  }
  ctx.lineWidth=7;
  if(o.glasses){
    ctx.lineWidth=6;ctx.strokeStyle='#111';
    for(const sd of[-1,1]){rr(sd*ex-34,ey-28,68,56,16);ctx.stroke();}
    ctx.beginPath();ctx.moveTo(-8,ey-6);ctx.lineTo(8,ey-6);ctx.stroke();ctx.lineWidth=7;ctx.strokeStyle=OUT;
  }
  if(o.blush){ctx.fillStyle='rgba(255,110,130,.45)';for(const sd of[-1,1]){ctx.beginPath();ctx.ellipse(sd*72,hy+48,20,12,0,0,7);ctx.fill();}}
  // mouth
  let m=o.mouth;if(m==='talk')m=(Math.sin(t*22)>-0.2)?'open':'smile';
  const my=hy+62;
  ctx.fillStyle='#6B1D2A';
  if(m==='smile'){ctx.beginPath();ctx.arc(0,my-14,34,0.15*Math.PI,0.85*Math.PI);ctx.stroke();}
  else if(m==='grin'){ctx.beginPath();ctx.moveTo(-48,my-8);ctx.quadraticCurveTo(0,my+70,48,my-8);ctx.closePath();ctx.fill();ctx.stroke();
    ctx.fillStyle='#fff';ctx.fillRect(-36,my-6,72,14);ctx.fillStyle='#FF7A90';ctx.beginPath();ctx.ellipse(0,my+26,18,9,0,0,7);ctx.fill();}
  else if(m==='open'){ctx.beginPath();ctx.ellipse(0,my+6,24,28,0,0,7);ctx.fill();ctx.stroke();ctx.fillStyle='#FF7A90';ctx.beginPath();ctx.ellipse(0,my+20,14,8,0,0,7);ctx.fill();}
  else if(m==='o'){ctx.beginPath();ctx.ellipse(0,my+6,14,17,0,0,7);ctx.fill();ctx.stroke();}
  else if(m==='sad'){ctx.beginPath();ctx.arc(0,my+30,30,1.15*Math.PI,1.85*Math.PI);ctx.stroke();}
  else if(m==='wavy'){ctx.beginPath();for(let i=0;i<=8;i++)ctx.lineTo(-40+i*10,my+(i%2?-7:7));ctx.lineWidth=6;ctx.stroke();}
  else if(m==='angry'){ctx.beginPath();ctx.ellipse(0,my+8,34,16,0,0,7);ctx.fill();ctx.stroke();ctx.fillStyle='#fff';ctx.fillRect(-26,my-2,52,8);}
  else {ctx.beginPath();ctx.moveTo(-26,my);ctx.lineTo(26,my);ctx.stroke();}
  if(o.mustache){ctx.fillStyle='#1b1b1b';ctx.beginPath();ctx.ellipse(-22,my-22,26,11,0.25,0,7);ctx.ellipse(22,my-22,26,11,-0.25,0,7);ctx.fill();}
  if(o.sweat){
    const sy=hy-40+((t*60)%40);
    ctx.fillStyle='#7FD3FF';ctx.beginPath();ctx.moveTo(122,sy-30);ctx.quadraticCurveTo(146,sy,122,sy+12);ctx.quadraticCurveTo(98,sy,122,sy-30);ctx.fill();ctx.lineWidth=4;ctx.stroke();
  }
  if(o.tears){
    ctx.fillStyle='#5BC0FF';
    for(const sd of[-1,1])for(let k=0;k<2;k++){
      const f=((t*1.6+k*0.5+(sd>0?.25:0))%1);
      ctx.beginPath();ctx.ellipse(sd*(ex+22),ey+30+f*120,9,14,0,0,7);ctx.globalAlpha=1-f;ctx.fill();ctx.globalAlpha=1;
    }
  }
  ctx.restore();
  ctx.restore();
}
const sardor=(x,y,s,o={})=>person(x,y,s,Object.assign({style:'doppi',shirt:'#2F6BFF',pants:'#2B3550'},o));
const ona=(x,y,s,o={})=>person(x,y,s,Object.assign({style:'scarf',dress:true,scarf:'#8E24AA',skin:'#EDBB8F'},o));
const konsultant=(x,y,s,o={})=>person(x,y,s,Object.assign({style:'neat',shirt:'#14213D',pants:'#14213D',tie:C.red,badge:'M',glasses:true,hair:'#2a1a10'},o));

/* ---------- props ---------- */
function logo(x,y,r,age){
  if(age<0)return;const p=pop(age/0.5);
  ctx.save();ctx.translate(x,y);ctx.scale(p,p);ctx.rotate((1-clamp(age/0.5))*-1.2);
  ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.arc(10,16,r,0,7);ctx.fill();
  const g=ctx.createLinearGradient(0,-r,0,r);g.addColorStop(0,'#FFE07A');g.addColorStop(1,'#F5A623');

  ctx.lineWidth=r*0.09;ctx.strokeStyle='#fff';ctx.stroke();
  ctx.fillStyle=C.navy;ctx.beginPath();ctx.arc(0,0,r*0.78,0,7);ctx.fill();
  ctx.font=font(r*1.05,900);ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#fff';ctx.fillText('M',0,r*0.06);
  ctx.save();ctx.rotate(age*1.5);emoji('✈️',r*0.92,0,r*0.5,Math.PI/2+Math.PI/4);ctx.restore();
  ctx.restore();
}
function paper(x,y,rot,label,s=1){
  ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.scale(s,s);
  ctx.fillStyle='rgba(0,0,0,.18)';rr(-92,-112,190,240,14);ctx.fill();
  ctx.fillStyle='#fff';ctx.strokeStyle=OUT;ctx.lineWidth=5;rr(-100,-120,190,240,14);ctx.fill();ctx.stroke();
  ctx.fillStyle=C.navy;ctx.font=font(label.length>11?22:27,900);ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(label,-5,-82);
  ctx.strokeStyle='#C8CEDA';ctx.lineWidth=6;
  for(let i=0;i<5;i++){ctx.beginPath();ctx.moveTo(-75,-40+i*26);ctx.lineTo(i===4?0:55,-40+i*26);ctx.stroke();}
  ctx.strokeStyle='rgba(230,57,70,.85)';ctx.lineWidth=5;ctx.beginPath();ctx.arc(45,80,28,0,7);ctx.stroke();
  ctx.font=font(16,900);ctx.fillStyle='rgba(230,57,70,.85)';ctx.fillText('MUHR',45,81);
  ctx.restore();
}
function plane(x,y,s,rot,t){
  ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.scale(s,s);

function render(t){
  t=clamp(t,0,DURATION-1e-6);
  ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.setLineDash([]);
  for(let i=0;i<SCENES.length;i++){
    const [a,b,f]=SCENES[i];
    if(t>=a&&t<b){
      ctx.save();f(t-a,b-a,t);ctx.restore();
      ctx.save();
      const lt=t-a,dur=b-a;
      iris(lt,dur,i>0,i<SCENES.length-1);
      ctx.restore();
      break;
    }
  }
}

window.DURATION=DURATION;

} else document.body.classList.add('render');
